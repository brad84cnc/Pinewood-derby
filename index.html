<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinewood Derby</title>
<style>
:root{
  --bg:#0f1420; --panel:#182033; --panel2:#1f2a42; --line:#2c3a5a; --text:#eef2fa; --dim:#8d9bb8;
  --accent:#ffb400; --accent2:#3aa0ff; --good:#3ddc84; --bad:#ff5c5c;
  --gold:#ffc83d; --silver:#c8d0de; --bronze:#d9894a;
  --l1:#e5484d; --l2:#3aa0ff; --l3:#3ddc84;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:#0c111c;border:1px solid var(--line);border-radius:8px;padding:.55em .7em}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent2);outline-offset:1px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.5em 1em}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);color:#1b1300;border-color:var(--accent);font-weight:700}
.btn.danger{border-color:#7a2f35;color:#ff9a9a}
.btn.small{padding:.25em .6em;font-size:.85em}
header{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.7rem 1.2rem;background:#0b101a;border-bottom:1px solid var(--line)}
header h1{font-size:1.25rem;margin:0;letter-spacing:.04em}
header h1 span{color:var(--accent)}
nav{display:flex;gap:.4rem;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;border-radius:8px;padding:.4em .9em}
nav button.on{background:var(--panel2);border-color:var(--line);color:var(--accent)}
.spacer{flex:1}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:.7rem 1.2rem 0}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.35em 1em}
.tabs button.on{background:var(--accent);color:#1b1300;border-color:var(--accent);font-weight:700}
main{padding:1rem 1.2rem 3rem;max-width:1700px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem}
.card h2{margin:.1em 0 .6em;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.lane{background:var(--panel2);border-radius:12px;border-top:6px solid var(--lc);padding:.7rem .8rem;text-align:center;min-width:0}
.lane .ln{font-size:.8rem;letter-spacing:.15em;color:var(--lc);font-weight:700}
.lane .num{font-size:clamp(2.6rem,6vw,5.5rem);font-weight:800;line-height:1.05}
.lane .nm{color:var(--dim);min-height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane input{width:100%;margin-top:.5rem;text-align:center;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.lane .tm{font-size:clamp(1.6rem,3vw,2.8rem);font-weight:700;font-variant-numeric:tabular-nums;margin-top:.4rem;min-height:1.3em}
.lane .pl{font-size:.9rem;font-weight:700}
.lane.empty{opacity:.35}
.lane.win{box-shadow:0 0 0 2px var(--gold) inset}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.heatbar{display:flex;gap:.8rem;align-items:baseline;margin-bottom:.7rem}
.heatbar .big{font-size:1.6rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{min-width:2.4em;text-align:center;padding:.3em .6em;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.cur{background:var(--accent);color:#1b1300;border-color:var(--accent);font-weight:700}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:.45em .6em;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
th.sorted{color:var(--accent)}
td.sorted{color:var(--accent);font-weight:700}
th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
td.name{max-width:14em;overflow:hidden;text-overflow:ellipsis}
tr.prov td{color:var(--dim)}
tr.prov td.sorted{color:var(--dim)}
.medal{display:inline-grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;font-weight:800;color:#1b1300;background:#3a4663}
.medal.p1{background:var(--gold)}.medal.p2{background:var(--silver)}.medal.p3{background:var(--bronze)}
.medal.prov{background:transparent;color:var(--dim);border:1px dashed var(--line)}
tr.p1 td.name,tr.p1 td.num{color:var(--gold);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:.45em 1em;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent2);color:#04121f;font-weight:700}
.muted{color:var(--dim)}
.note{color:var(--dim);font-size:.9rem}
.warn{background:#3a2a10;border:1px solid #7a5a1c;color:#ffd28a;border-radius:10px;padding:.6em .9em;margin-bottom:.8rem}
.setup-class{border:1px solid var(--line);border-radius:12px;padding:.9rem;margin-bottom:1rem;background:var(--panel)}
.carrow{display:flex;gap:.5rem;margin:.3rem 0}
.carrow input.n{width:5em}
.carrow input.nm{flex:1;min-width:0}
.pic{display:block;width:100%;height:clamp(5rem,13vh,10rem);object-fit:cover;border-radius:8px;margin:.4rem 0 .2rem;background:#0c111c}
.thumb{width:2.4em;height:1.8em;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:.5em;background:#0c111c}
.thumbbtn{width:4.2rem;height:3.2rem;padding:0;border:1px dashed var(--line);border-radius:8px;background:#0c111c;overflow:hidden;font-size:1.4rem}
.thumbbtn img{width:100%;height:100%;object-fit:cover;display:block}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;padding:1rem}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;width:min(640px,100%)}
.modal h3{margin:.1em 0 .6em}
.modal video{width:100%;max-height:55vh;background:#000;border-radius:8px;margin-bottom:.6rem}
.over{color:var(--bad)!important;font-weight:700}
input.over{border-color:var(--bad);outline:1px solid var(--bad)}
.carrow input.wt{width:5.5em;text-align:right}
.big-empty{text-align:center;padding:3rem 1rem;color:var(--dim)}
/* TV mode */
body.tv header,body.tv .tabs{display:none}
body.tv main{max-width:none;padding:1.2vw 1.6vw}
body.tv .card{padding:1.2vw 1.4vw}
body.tv .card h2{font-size:1.1vw}
body.tv .grid2{grid-template-columns:minmax(0,.85fr) minmax(0,1.25fr)}
body.tv table{font-size:1.2vw}
body.tv th,body.tv td{padding:.4vw .5vw}
body.tv td.name{max-width:9vw}
body.tv th{font-size:.8vw}
body.tv .medal{font-size:1.1vw}
body.tv .heatbar .big{font-size:2.6vw}
body.tv .lane .nm{font-size:1.4vw}
body.tv .pic{height:11vw}
body.tv .lane .wt{font-size:1.2vw!important}
body.tv .lane .ln{font-size:1vw}
body.tv .chip{font-size:1vw}
.tvbar{position:fixed;top:.6rem;right:.8rem;display:none;gap:.4rem;opacity:.15;transition:opacity .2s;z-index:5}
.tvbar:hover{opacity:1}
body.tv .tvbar{display:flex}
body.tv.idle{cursor:none}
.tvtitle{display:none}
body.tv .tvtitle{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .8vw}
body.tv .tvtitle h1{font-size:3vw;margin:0}
body.tv .tvtitle h1 span{color:var(--accent)}
body.tv .tvtitle .cls{font-size:2.4vw;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="tvbar">
  <button class="btn small" data-act="fs">Fullscreen</button>
  <button class="btn small" data-act="exit-tv">Exit TV mode</button>
</div>
<header>
  <h1>🏁 <span>PINEWOOD</span> DERBY</h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="btn primary" data-act="tv">📺 TV mode</button>
</header>
<div id="tabs" class="tabs"></div>
<main id="app"></main>

<!-- ============ CORE (pure logic; tested in Node) ============ -->
<script id="core">
const LANES = 3;
const q = x => Math.round(x * 10000);
const uid = () => Math.random().toString(36).slice(2, 8);

// One heat per car (min 3). Heat i, lane k holds car (i+k) mod m, so every car
// runs each lane exactly once. With <3 cars, the missing lanes are left empty.
function generateHeats(ids) {
  const n = ids.length;
  if (!n) return [];
  const m = Math.max(n, LANES), heats = [];
  for (let i = 0; i < m; i++) {
    const lanes = [];
    for (let k = 0; k < LANES; k++) { const j = (i + k) % m; lanes.push(j < n ? ids[j] : null); }
    heats.push({ lanes, times: [null, null, null] });
  }
  return heats;
}

function shuffled(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function heatDone(h) {
  return h.lanes.every((c, k) => !c || typeof h.times[k] === 'number');
}

// Place (1..3) of each lane in a heat; null until the whole heat has times.
function heatPlaces(h) {
  const r = h.lanes.map(() => null);
  const occ = [];
  h.lanes.forEach((c, k) => { if (c) occ.push(k); });
  if (!occ.length || !heatDone(h)) return r;
  occ.forEach(k => { r[k] = 1 + occ.filter(o => q(h.times[o]) < q(h.times[k])).length; });
  return r;
}

const METHODS = {
  avg:    { label: 'Average time', col: 'avg',    key: r => [q(r.avg), q(r.best)] },
  total:  { label: 'Total time',   col: 'total',  key: r => [q(r.total), q(r.best)] },
  points: { label: 'Heat points',  col: 'points', key: r => [r.points, q(r.avg)] },
  best:   { label: 'Fastest run',  col: 'best',   key: r => [q(r.best), q(r.avg)] },
};

const cmpKey = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };

function computeStandings(cls, method) {
  const M = METHODS[method] || METHODS.avg;
  const rows = cls.cars.map(car => ({ car, runs: [], expected: 0, done: 0, total: 0, avg: 0, best: Infinity, points: 0 }));
  const byId = Object.fromEntries(rows.map(r => [r.car.id, r]));
  cls.heats.forEach((h, hi) => {
    const pl = heatPlaces(h);
    h.lanes.forEach((cid, k) => {
      const r = cid && byId[cid]; if (!r) return;
      r.expected++;
      const t = h.times[k];
      if (typeof t === 'number') {
        r.done++; r.total += t; r.best = Math.min(r.best, t);
        if (pl[k]) r.points += pl[k];
      }
      r.runs.push({ heat: hi, lane: k, time: typeof t === 'number' ? t : null, place: pl[k] });
    });
  });
  rows.forEach(r => { r.avg = r.done ? r.total / r.done : 0; r.complete = r.expected > 0 && r.done === r.expected; });
  const numOf = r => parseInt(r.car.num, 10) || 0;
  const cmp = (a, b) => cmpKey(M.key(a), M.key(b)) || numOf(a) - numOf(b);
  const complete = rows.filter(r => r.complete).sort(cmp);
  const partial = rows.filter(r => !r.complete && r.done > 0).sort(cmp);
  const none = rows.filter(r => r.done === 0).sort((a, b) => numOf(a) - numOf(b));
  let offset = 0;
  [complete, partial].forEach(g => {
    g.forEach((r, i) => {
      const prev = g[i - 1];
      r.place = (prev && cmpKey(M.key(prev), M.key(r)) === 0) ? prev.place : offset + i + 1;
      r.provisional = !r.complete;
    });
    offset += g.length;
  });
  none.forEach(r => { r.place = null; r.provisional = true; });
  return [...complete, ...partial, ...none];
}

const fmt = (t, d = 3) => (typeof t === 'number' && isFinite(t)) ? t.toFixed(d) : '–';
const parseWeight = s => { const n = parseFloat(String(s ?? '').trim().replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
const isOver = (car, max) => { const w = parseWeight(car.weight), m = parseWeight(max); return w != null && m != null && q(w) > q(m); };
const fmtWt = w => { const n = parseWeight(w); return n == null ? '' : (Math.round(n * 100) / 100) + ' oz'; };
const parseTime = s => { const n = parseFloat(String(s).trim().replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
// True when the car list no longer matches the cars the heats were built from.
function heatsStale(cls) {
  if (!cls.heats.length) return false;
  const inHeats = new Set(cls.heats.flatMap(h => h.lanes).filter(Boolean));
  return inHeats.size !== cls.cars.length || cls.cars.some(c => !inHeats.has(c.id));
}
</script>

<!-- ============ APP ============ -->
<script>
const KEY = 'pinewood.v1';
const DEFAULT_CLASSES = ['Lion', 'Tiger', 'Wolf', 'Bear', 'Webelos', 'Arrow of Light', 'X Class (Adults)'];
let S, view = location.hash === '#tv' ? 'tv' : 'race', stSel = null;

function fresh() {
  const classes = DEFAULT_CLASSES.map(name => ({ id: uid(), name, cars: [], heats: [] }));
  return { v: 1, title: 'Pinewood Derby', classes, active: classes[0].id, cur: {}, method: 'avg', maxWeight: '5' };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.classes) return s; } catch (e) {}
  return fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!save.warned) { save.warned = 1; alert('Browser storage is full, so changes are not being saved. Export a backup and remove some photos.'); } }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const cls = () => S.classes.find(c => c.id === S.active) || S.classes[0];
const carOf = (c, id) => c.cars.find(x => x.id === id);
const nextIncomplete = (c, from = 0) => {
  const n = c.heats.length;
  for (let i = 0; i < n; i++) { const j = (from + i) % n; if (!heatDone(c.heats[j])) return j; }
  return -1;
};
function curHeat(c) {
  if (!c.heats.length) return -1;
  let i = S.cur[c.id];
  if (i == null || i < 0 || i >= c.heats.length) { i = nextIncomplete(c); if (i < 0) i = c.heats.length - 1; S.cur[c.id] = i; }
  return i;
}

/* ---------- rendering ---------- */
function render() {
  document.body.classList.toggle('tv', view === 'tv');
  const nav = [['race', 'Race'], ['standings', 'Standings'], ['setup', 'Setup']];
  $('nav').innerHTML = nav.map(([k, l]) => `<button class="${view === k ? 'on' : ''}" data-view="${k}">${l}</button>`).join('');
  const showTabs = view === 'race' || view === 'standings';
  let tabs = '';
  if (showTabs) {
    tabs = S.classes.map(c => `<button class="${(view === 'standings' ? stSel : S.active) === c.id ? 'on' : ''}" data-class="${c.id}">${esc(c.name)}</button>`).join('');
    if (view === 'standings') tabs += `<button class="${stSel === 'all' ? 'on' : ''}" data-class="all">★ Overall</button>`;
  }
  $('tabs').innerHTML = tabs;
  $('tabs').style.display = showTabs ? '' : 'none';
  const app = $('app');
  if (view === 'race') app.innerHTML = renderRace(false);
  else if (view === 'tv') app.innerHTML = renderTV();
  else if (view === 'standings') app.innerHTML = renderStandings();
  else app.innerHTML = renderSetup();
  if (view === 'race') focusFirstInput();
}

function laneCards(c, hi, edit) {
  const h = c.heats[hi], pl = heatPlaces(h);
  const colors = ['var(--l1)', 'var(--l2)', 'var(--l3)'];
  return `<div class="lanes">` + h.lanes.map((cid, k) => {
    const car = cid && carOf(c, cid);
    if (!car) return `<div class="lane empty" style="--lc:${colors[k]}"><div class="ln">LANE ${k + 1}</div><div class="num">–</div><div class="nm">empty</div></div>`;
    const t = h.times[k];
    const win = pl[k] === 1 ? ' win' : '';
    const body = edit
      ? `<input data-lane="${k}" inputmode="decimal" autocomplete="off" placeholder="0.000" value="${typeof t === 'number' ? t.toFixed(3) : ''}">`
      : `<div class="tm">${typeof t === 'number' ? fmt(t) : '&nbsp;'}</div>${pl[k] ? `<div class="pl">${['', '1st', '2nd', '3rd'][pl[k]] || pl[k] + 'th'}</div>` : ''}`;
    return `<div class="lane${win}" style="--lc:${colors[k]}"><div class="ln">LANE ${k + 1}</div>${car.photo ? `<img class="pic" src="${car.photo}" alt="">` : ''}<div class="num">${esc(car.num)}</div><div class="nm">${esc(car.name) || '&nbsp;'}</div><div class="wt${isOver(car, S.maxWeight) ? ' over' : ''}" style="min-height:1.3em;font-size:.9em">${fmtWt(car.weight)}${isOver(car, S.maxWeight) ? ' OVERWEIGHT' : ''}</div>${body}</div>`;
  }).join('') + `</div>`;
}

function onDeck(c, hi) {
  const n = c.heats.length;
  const j = nextIncomplete(c, hi + 1);
  if (j < 0 || j === hi) return '<span class="muted">No more heats to run.</span>';
  const h = c.heats[j];
  return `<b>Heat ${j + 1}:</b> ` + h.lanes.map((cid, k) => { const car = cid && carOf(c, cid); return car ? `L${k + 1}&nbsp;<b>#${esc(car.num)}</b>` : ''; }).filter(Boolean).join(' &nbsp;·&nbsp; ');
}

function chips(c, hi, clickable) {
  return `<div class="chips">` + c.heats.map((h, i) =>
    `<${clickable ? 'button' : 'span'} class="chip ${heatDone(h) ? 'done' : ''} ${i === hi ? 'cur' : ''}" ${clickable ? `data-heat="${i}"` : ''}>${i + 1}</${clickable ? 'button' : 'span'}>`).join('') + `</div>`;
}

function renderRace(tv) {
  const c = cls();
  if (!c.cars.length) return `<div class="card big-empty">No cars in <b>${esc(c.name)}</b> yet.<br><br><button class="btn primary" data-view="setup">Go to Setup</button></div>`;
  if (!c.heats.length) return `<div class="card big-empty">Heats haven't been built for <b>${esc(c.name)}</b> yet.<br><br><button class="btn primary" data-act="build" data-id="${c.id}">Build heats now</button></div>`;
  const hi = curHeat(c), h = c.heats[hi];
  const allDone = nextIncomplete(c) < 0;
  const stale = heatsStale(c) ? `<div class="warn">The car list changed since heats were built. Rebuild in Setup to include the changes.</div>` : '';
  return `${stale}<div class="grid2"><div>
    <div class="card">
      <div class="heatbar"><span class="big">Heat ${hi + 1} <span class="muted">of ${c.heats.length}</span></span>
        <span class="muted">${esc(c.name)}</span><span class="spacer"></span>
        ${allDone ? '<span style="color:var(--good);font-weight:700">🏁 All heats complete</span>' : ''}</div>
      ${laneCards(c, hi, true)}
      <div class="row" style="margin-top:.9rem">
        <button class="btn primary" data-act="save-heat">Save heat ⏎</button>
        <button class="btn" data-act="clear-heat">Clear heat</button>
        <span class="spacer"></span>
        <button class="btn" data-act="prev">← Prev</button><button class="btn" data-act="next">Next →</button>
      </div>
      <p class="note">Type each lane's time (seconds) and press Enter to move to the next lane; Enter on the last lane saves and loads the next heat.</p>
    </div>
    <div class="card"><h2>On deck</h2>${onDeck(c, hi)}</div>
    <div class="card"><h2>Heats</h2>${chips(c, hi, true)}</div>
  </div><div>${standingsCard(c, true)}</div></div>`;
}

function renderTV() {
  const c = cls();
  const head = `<div class="tvtitle"><h1>🏁 <span>${esc(S.title || 'Pinewood Derby')}</span></h1><div class="cls">${esc(c.name)}</div></div>`;
  if (!c.cars.length || !c.heats.length) return head + `<div class="card big-empty" style="font-size:2vw">Waiting for the next race…</div>`;
  const hi = curHeat(c);
  return head + `<div class="grid2"><div>
    <div class="card"><div class="heatbar"><span class="big">Heat ${hi + 1} <span class="muted">of ${c.heats.length}</span></span><span class="spacer"></span>
      ${nextIncomplete(c) < 0 ? '<span style="color:var(--good);font-weight:700;font-size:1.6vw">🏁 Class complete</span>' : ''}</div>
      ${laneCards(c, hi, false)}</div>
    <div class="card"><h2>On deck</h2><div style="font-size:1.6vw">${onDeck(c, hi)}</div></div>
    <div class="card"><h2>Heats</h2>${chips(c, hi, false)}</div>
  </div><div>${standingsCard(c, true)}</div></div>`;
}

function standingsTable(c) {
  const M = METHODS[S.method] || METHODS.avg;
  const rows = computeStandings(c, S.method);
  const cols = ['avg', 'total', 'best', 'points'];
  const head = `<tr><th>Place</th><th>Car</th><th>Name</th><th>Wt</th><th>L1</th><th>L2</th><th>L3</th>` +
    cols.map(k => `<th class="${M.col === k ? 'sorted' : ''}">${{ avg: 'Avg', total: 'Total', best: 'Best', points: 'Pts' }[k]}</th>`).join('') + `</tr>`;
  const body = rows.map(r => {
    const lane = [0, 1, 2].map(k => { const run = r.runs.find(x => x.lane === k); return `<td>${run ? fmt(run.time) : ''}</td>`; }).join('');
    const med = r.place ? `<span class="medal ${r.provisional ? 'prov' : 'p' + r.place}">${r.place}</span>` : '';
    const v = { avg: fmt(r.done ? r.avg : null, 4), total: fmt(r.done ? r.total : null), best: fmt(r.done ? r.best : null), points: r.done ? r.points : '–' };
    return `<tr class="${r.provisional ? 'prov' : ''} ${!r.provisional && r.place === 1 ? 'p1' : ''}"><td>${med}</td><td class="num">#${esc(r.car.num)}</td><td class="name">${r.car.photo ? `<img class="thumb" src="${r.car.photo}" alt="">` : ''}${esc(r.car.name)}${r.provisional && r.done ? ` <span class="muted">(${r.done}/${r.expected})</span>` : ''}</td><td class="${isOver(r.car, S.maxWeight) ? 'over' : ''}">${fmtWt(r.car.weight).replace(' oz', '')}</td>${lane}` +
      cols.map(k => `<td class="${M.col === k ? 'sorted' : ''}">${v[k]}</td>`).join('') + `</tr>`;
  }).join('');
  return `<table>${head}${body}</table>`;
}

function methodSeg() {
  return `<div class="seg">` + Object.entries(METHODS).map(([k, m]) => `<button class="${S.method === k ? 'on' : ''}" data-method="${k}">${m.label}</button>`).join('') + `</div>`;
}
function standingsCard(c, compact) {
  const controls = view === 'tv' ? `<div class="muted" style="font-size:1.1vw;margin-bottom:.6vw">Ranked by ${(METHODS[S.method] || METHODS.avg).label.toLowerCase()}</div>` : `<div style="margin-bottom:.7rem">${methodSeg()}</div>`;
  return `<div class="card"><h2>Standings — ${esc(c.name)}</h2>${controls}${c.cars.length ? standingsTable(c) : '<span class="muted">No cars.</span>'}</div>`;
}

function renderStandings() {
  if (!stSel) stSel = S.active;
  if (stSel === 'all') return renderOverall();
  const c = S.classes.find(x => x.id === stSel) || cls();
  return `<div class="card"><div class="row"><span class="muted">Provisional (dashed) places are shown for cars that haven't finished all their runs.</span></div></div>` + standingsCard(c);
}

function renderOverall() {
  const winners = S.classes.map(c => {
    const rows = computeStandings(c, S.method).filter(r => r.place);
    const top = rows.filter(r => r.place === 1);
    const done = c.heats.length && nextIncomplete(c) < 0;
    return `<tr><td style="text-align:left">${esc(c.name)}</td><td style="text-align:left">${top.length ? top.map(r => `#${esc(r.car.num)} ${esc(r.car.name)}`).join(', ') : '–'}</td><td>${done ? 'Final' : (c.heats.length ? 'Racing' : '—')}</td></tr>`;
  }).join('');
  const runs = [];
  S.classes.forEach(c => c.heats.forEach(h => h.lanes.forEach((cid, k) => { const t = h.times[k]; const car = cid && carOf(c, cid); if (car && typeof t === 'number') runs.push({ t, car, c, k }); })));
  runs.sort((a, b) => a.t - b.t);
  const fast = runs.slice(0, 10).map((r, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${esc(r.c.name)}</td><td style="text-align:left">#${esc(r.car.num)} ${esc(r.car.name)}</td><td>Lane ${r.k + 1}</td><td>${fmt(r.t)}</td></tr>`).join('');
  return `<div class="card"><div style="margin-bottom:.7rem">${methodSeg()}</div><h2>Class leaders</h2><table><tr><th style="text-align:left">Class</th><th style="text-align:left">Leader</th><th>Status</th></tr>${winners}</table></div>
  <div class="card"><h2>Fastest runs of the day</h2>${runs.length ? `<table><tr><th>#</th><th>Class</th><th>Car</th><th>Lane</th><th>Time</th></tr>${fast}</table>` : '<span class="muted">No times yet.</span>'}</div>`;
}

function overBanner() {
  const over = S.classes.flatMap(c => c.cars.filter(x => isOver(x, S.maxWeight)).map(x => `#${esc(x.num)} ${esc(x.name)} (${esc(fmtWt(x.weight))})`));
  return over.length ? `<div class="warn">Over ${esc(S.maxWeight)} oz: ${over.join(', ')}</div>` : '';
}
function renderSetup() {
  const c = cls();
  return `<div class="card"><h2>Event</h2><div class="row"><label>Title <input id="title" value="${esc(S.title)}" size="30"></label>
    <label>Max weight (oz) <input id="maxw" value="${esc(S.maxWeight ?? '5')}" size="4" inputmode="decimal" title="Leave blank for no limit"></label>
    <span class="spacer"></span>
    <button class="btn" data-act="export">⬇ Export backup</button>
    <button class="btn" data-act="import">⬆ Import backup</button>
    <button class="btn danger" data-act="reset">Reset event</button>
    <input type="file" id="file" accept="application/json" hidden></div></div>` +
    `<div id="overbanner">${overBanner()}</div>` +
    S.classes.map(c => {
      const hasTimes = c.heats.some(h => h.times.some(t => typeof t === 'number'));
      return `<div class="setup-class" data-cid="${c.id}">
        <div class="row" style="margin-bottom:.6rem"><input data-rename="${c.id}" value="${esc(c.name)}" style="font-weight:700;font-size:1.1rem">
          <span class="muted">${c.cars.length} car${c.cars.length === 1 ? '' : 's'}${c.heats.length ? ` · ${c.heats.length} heats${hasTimes ? ' · racing started' : ''}` : ''}</span>
          <span class="spacer"></span>
          <button class="btn small primary" data-act="build" data-id="${c.id}">${c.heats.length ? 'Rebuild heats' : 'Build heats'}</button>
          <button class="btn small" data-act="shuffle" data-id="${c.id}">Shuffle &amp; build</button>
          <button class="btn small danger" data-act="del-class" data-id="${c.id}">Delete class</button></div>
        ${heatsStale(c) ? '<div class="warn">Car list changed — rebuild heats.</div>' : ''}
        ${c.cars.map(x => `<div class="carrow"><button class="thumbbtn" data-act="photo" data-id="${c.id}" data-car="${x.id}" title="Car photo">${x.photo ? `<img src="${x.photo}" alt="">` : '📷'}</button><input class="n" data-car="${c.id}:${x.id}:num" value="${esc(x.num)}" aria-label="Car number"><input class="nm" data-car="${c.id}:${x.id}:name" value="${esc(x.name)}" placeholder="Racer / car name"><input class="wt${isOver(x, S.maxWeight) ? ' over' : ''}" data-car="${c.id}:${x.id}:weight" value="${esc(x.weight)}" placeholder="oz" inputmode="decimal" aria-label="Weight in ounces"><button class="btn small danger" data-act="del-car" data-id="${c.id}" data-car="${x.id}">✕</button></div>`).join('')}
        <div class="row" style="margin-top:.5rem"><button class="btn small" data-act="add-car" data-id="${c.id}">+ Add car</button>
          <button class="btn small" data-act="bulk" data-id="${c.id}">+ Paste list of names</button></div></div>`;
    }).join('') + `<button class="btn" data-act="add-class">+ Add class</button>`;
}

/* ---------- car photos ---------- */
function photoDialog(cid, xid) {
  const car = carOf(S.classes.find(c => c.id === cid), xid);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h3>Photo: #${esc(car.num)} ${esc(car.name)}</h3><video autoplay playsinline muted></video><div class="note msg"></div>
    <div class="row"><button class="btn primary" data-m="snap">📷 Take photo</button><button class="btn" data-m="file">Choose file…</button>
    ${car.photo ? '<button class="btn danger" data-m="rm">Remove photo</button>' : ''}<span class="spacer"></span><button class="btn" data-m="close">Cancel</button></div>
    <input type="file" accept="image/*" hidden></div>`;
  document.body.appendChild(m);
  const video = m.querySelector('video'), msg = m.querySelector('.msg'), file = m.querySelector('input');
  let stream;
  const close = () => { stream && stream.getTracks().forEach(t => t.stop()); m.remove(); };
  const apply = (src, w, h) => {
    const k = Math.min(1, 480 / Math.max(w, h)), cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
    car.photo = cv.toDataURL('image/jpeg', 0.78); save(); render(); close();
  };
  if (navigator.mediaDevices?.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { width: 1280 } }).then(s => { stream = s; video.srcObject = s; })
      .catch(() => { video.hidden = true; msg.textContent = 'Camera not available. Use "Choose file" instead.'; });
  } else { video.hidden = true; msg.textContent = 'Camera not available. Use "Choose file" instead.'; }
  m.addEventListener('click', e => {
    const a = e.target.closest('button')?.dataset.m; if (!a) { if (e.target === m) close(); return; }
    if (a === 'close') close();
    else if (a === 'file') file.click();
    else if (a === 'rm') { delete car.photo; save(); render(); close(); }
    else if (a === 'snap') { if (video.videoWidth) apply(video, video.videoWidth, video.videoHeight); else msg.textContent = 'Camera not ready yet.'; }
  });
  file.addEventListener('change', () => {
    const f = file.files[0]; if (!f) return;
    createImageBitmap(f).then(b => apply(b, b.width, b.height)).catch(() => { msg.textContent = 'Could not read that image.'; });
  });
}

/* ---------- actions ---------- */
function focusFirstInput() {
  const ins = [...document.querySelectorAll('.lane input')];
  const el = ins.find(i => !i.value) || ins[0];
  if (el && !document.activeElement?.matches?.('.lane input')) { el.focus(); el.select(); }
}
function nextNum() {
  const all = S.classes.flatMap(c => c.cars.map(x => parseInt(x.num, 10) || 0));
  return String(Math.max(0, ...all) + 1);
}
function build(c, shuffle) {
  const hasTimes = c.heats.some(h => h.times.some(t => typeof t === 'number'));
  if (hasTimes && !confirm(`${c.name} already has recorded times. Rebuilding will ERASE them. Continue?`)) return;
  const ids = c.cars.map(x => x.id);
  c.heats = generateHeats(shuffle ? shuffled(ids) : ids);
  delete S.cur[c.id]; save(); render();
}
function saveHeat() {
  const c = cls(), hi = curHeat(c); if (hi < 0) return;
  const h = c.heats[hi], times = [null, null, null];
  const inputs = [...document.querySelectorAll('.lane input')];
  for (const inp of inputs) {
    const t = parseTime(inp.value);
    if (t == null) { inp.focus(); inp.select(); inp.style.outline = '2px solid var(--bad)'; return; }
    times[+inp.dataset.lane] = t;
  }
  h.times = times;
  const nx = nextIncomplete(c, hi + 1);
  S.cur[c.id] = nx >= 0 ? nx : hi;
  save(); render();
}
const act = {
  tv() { view = 'tv'; history.replaceState(null, '', '#tv'); render(); },
  'exit-tv'() { view = 'race'; history.replaceState(null, '', location.pathname); if (document.fullscreenElement) document.exitFullscreen(); render(); },
  fs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); },
  build(d) { build(S.classes.find(c => c.id === d.id), false); },
  shuffle(d) { build(S.classes.find(c => c.id === d.id), true); },
  'save-heat': saveHeat,
  'clear-heat'() { const c = cls(), hi = curHeat(c); c.heats[hi].times = [null, null, null]; save(); render(); },
  prev() { const c = cls(); S.cur[c.id] = Math.max(0, curHeat(c) - 1); save(); render(); },
  next() { const c = cls(); S.cur[c.id] = Math.min(c.heats.length - 1, curHeat(c) + 1); save(); render(); },
  'add-class'() { const n = prompt('Class name?'); if (n) { S.classes.push({ id: uid(), name: n, cars: [], heats: [] }); save(); render(); } },
  'del-class'(d) { const c = S.classes.find(x => x.id === d.id); if (confirm(`Delete "${c.name}" and all its cars and times?`)) { S.classes = S.classes.filter(x => x !== c); if (!S.classes.length) S.classes.push({ id: uid(), name: 'Class 1', cars: [], heats: [] }); if (!S.classes.find(x => x.id === S.active)) S.active = S.classes[0].id; save(); render(); } },
  'add-car'(d) { const c = S.classes.find(x => x.id === d.id); c.cars.push({ id: uid(), num: nextNum(), name: '' }); save(); render(); const ins = document.querySelectorAll(`[data-cid="${c.id}"] input.nm`); ins[ins.length - 1]?.focus(); },
  'del-car'(d) { const c = S.classes.find(x => x.id === d.id); c.cars = c.cars.filter(x => x.id !== d.car); save(); render(); },
  bulk(d) {
    const c = S.classes.find(x => x.id === d.id);
    const t = prompt('Paste names, one per line (car numbers are assigned automatically):'); if (!t) return;
    t.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(n => c.cars.push({ id: uid(), num: nextNum(), name: n }));
    save(); render();
  },
  photo(d) { photoDialog(d.id, d.car); },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = `pinewood-derby-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  },
  import() { $('file').click(); },
  reset() { if (confirm('Erase ALL classes, cars and times?') && confirm('Really erase everything? This cannot be undone (export a backup first).')) { S = fresh(); stSel = null; save(); render(); } },
};

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; history.replaceState(null, '', location.pathname); render(); }
  else if (t.dataset.class) { if (view === 'standings') stSel = t.dataset.class; else S.active = t.dataset.class; if (t.dataset.class !== 'all') S.active = t.dataset.class; save(); render(); }
  else if (t.dataset.method) { S.method = t.dataset.method; save(); render(); }
  else if (t.dataset.heat) { const c = cls(); S.cur[c.id] = +t.dataset.heat; save(); render(); }
  else if (t.dataset.act && act[t.dataset.act]) act[t.dataset.act](t.dataset);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.lane input')) {
    e.preventDefault();
    const ins = [...document.querySelectorAll('.lane input')], i = ins.indexOf(e.target);
    if (i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select(); } else saveHeat();
  }
  if (view === 'tv' && e.key === 'Escape') act['exit-tv']();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'title') { S.title = t.value; save(); }
  else if (t.id === 'maxw') { S.maxWeight = t.value; save(); document.querySelectorAll('input.wt').forEach(i => { const [cid, xid] = i.dataset.car.split(':'); i.classList.toggle('over', isOver(carOf(S.classes.find(c => c.id === cid), xid), S.maxWeight)); }); $('overbanner').innerHTML = overBanner(); }
  else if (t.dataset.rename) { S.classes.find(c => c.id === t.dataset.rename).name = t.value; save(); }
  else if (t.dataset.car) { const [cid, xid, f] = t.dataset.car.split(':'); const car = carOf(S.classes.find(c => c.id === cid), xid); car[f] = t.value; save(); if (f === 'weight') { t.classList.toggle('over', isOver(car, S.maxWeight)); $('overbanner').innerHTML = overBanner(); } }
  else if (t.matches('.lane input')) t.style.outline = '';
});
document.addEventListener('change', e => {
  if (e.target.id !== 'file') return;
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    try { const s = JSON.parse(txt); if (!s.classes) throw 0; if (confirm('Replace current data with this backup?')) { S = s; stSel = null; save(); render(); } }
    catch (err) { alert('That file is not a valid backup.'); }
  });
});
// Keep a second window (e.g. the TV) in sync with the laptop.
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  S = load();
  if (view === 'tv' || !document.activeElement || !document.activeElement.matches('input')) render();
});
// Hide the mouse cursor in TV mode after a few idle seconds.
let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); });

S = load(); render();
</script>
</body>
</html>
